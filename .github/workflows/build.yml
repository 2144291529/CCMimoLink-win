name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="ccmimolink-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "$out" .
          ls -la "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccmimolink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ccmimolink-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Build release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f USAGE_zh.md ]; then
              cat USAGE_zh.md
              echo
              echo '---'
              echo
            fi
            echo '## Downloads'
            echo
            echo '| Platform | File |'
            echo '| --- | --- |'
            echo '| Windows x64 | `ccmimolink-windows-amd64.exe` |'
            echo '| Windows ARM64 | `ccmimolink-windows-arm64.exe` |'
            echo '| Linux x64 | `ccmimolink-linux-amd64` |'
            echo '| Linux ARM64 | `ccmimolink-linux-arm64` |'
            echo '| macOS Intel | `ccmimolink-darwin-amd64` |'
            echo '| macOS Apple Silicon | `ccmimolink-darwin-arm64` |'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.notes.outputs.body }}
          append_body: true
          generate_release_notes: true
